name: Build Debug APK
on:
  workflow_dispatch:
name: Build Debug APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install exact Android toolchain
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;4.1.2'
      - name: Apply CPU LES compatibility patch
        run: |
          ls -l patches/
          git -C llama.cpp-omni apply --check ../patches/android-cpu-les.patch
          git -C llama.cpp-omni apply ../patches/android-cpu-les.patch
          echo patch-applied
      - name: Build debug APK
        working-directory: MiniCPM-V-demo-Android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2
      - name: Collect APK
        run: |
          mkdir -p dist
          find MiniCPM-V-demo-Android/app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: MiniCPM-V-Android-debug
          path: dist/
          retention-days: 7
          if-no-files-found: error
