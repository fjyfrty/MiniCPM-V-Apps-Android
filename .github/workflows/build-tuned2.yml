name: Build Tuned APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;4.1.2'
      - name: Apply CPU LES patch
        run: |
          git -C llama.cpp-omni apply --check ../patches/android-cpu-les.patch
          git -C llama.cpp-omni apply ../patches/android-cpu-les.patch
          echo patch-applied
      - name: Tune LES parameters
        run: |
          set -e
          J=MiniCPM-V-demo-Android/app/src/main/cpp/llama_jni.cpp
          K=MiniCPM-V-demo-Android/app/src/main/java/com/example/minicpm_v_demo/LlamaEngine.kt
          perl -0pi -e 's/N_THREADS\s*=\s*4;/N_THREADS = 8;/' "$J"
          perl -0pi -e 's/LLAMA_MOE_IO_THREADS", "4"/LLAMA_MOE_IO_THREADS", "8"/' "$J"
          perl -0pi -e 's/else -> 16/else -> 32/' "$K"
          echo '--- verify ---'
          grep -q 'N_THREADS = 8;' "$J"
          echo 'threads=8 OK'
          grep -q 'LLAMA_MOE_IO_THREADS", "8"' "$J"
          echo 'io_threads=8 OK'
          grep -q 'else -> 32' "$K"
          echo 'decode_window=32 OK'
      - name: Build debug APK
        working-directory: MiniCPM-V-demo-Android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2
      - name: Collect APK
        run: |
          mkdir -p dist
          cp MiniCPM-V-demo-Android/app/build/outputs/apk/debug/app-debug.apk dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: apk-tuned
          path: dist/
          if-no-files-found: error
